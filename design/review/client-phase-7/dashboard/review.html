<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 7 Dashboard visual review</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #e9eeee; color: #09262b; }
    body { margin: 0; padding: 24px; }
    header { max-width: 1000px; margin: 0 auto 20px; }
    h1 { margin: 0; font-size: 24px; } p { color: #5f6d73; line-height: 1.5; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 430px)); justify-content: center; gap: 24px; align-items: start; }
    figure { margin: 0; overflow: hidden; border: 1px solid #dfe5e6; border-radius: 20px; background: white; box-shadow: 0 12px 32px rgb(0 42 49 / .1); }
    figcaption { padding: 14px 16px; border-bottom: 1px solid #dfe5e6; font-weight: 700; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 800px) { body { padding: 16px; } main { grid-template-columns: minmax(0, 430px); } }
  </style>
</head>
<body>
  <header><h1>Dashboard — Phase 7 approval review</h1><p>The reference contains illustrative values and simulated OS chrome. Review composition, hierarchy, typography, spacing, surfaces, and navigation; production data remains authoritative.</p></header>
  <main>
    <figure><figcaption>Approved primary reference</figcaption><img src="../../../reference/client-mobile/v1/originals/dashboard-standalone.png" alt="Approved Dashboard reference" /></figure>
    <figure><figcaption>Responsive web — 430 × 932</figcaption><img src="captures/mobile-430.png" alt="Dashboard web implementation at 430 by 932" /></figure>
  </main>
</body>
</html>
